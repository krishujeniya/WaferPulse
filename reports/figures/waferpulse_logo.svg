<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="wp-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="wp-pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="wp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Wafer + Pulse) -->
  <g transform="translate(10, 10)">
    <!-- Outer Silicon Wafer Edge -->
    <path d="M 50 4 
             A 46 46 0 0 1 96 50 
             A 46 46 0 0 1 54 95.8 
             L 50 92 
             L 46 95.8 
             A 46 46 0 0 1 4 50 
             A 46 46 0 0 1 50 4 Z" 
          stroke="url(#wp-brand-grad)" 
          stroke-width="2.5" 
          fill="#080c14" />

    <!-- Concentric Telemetry Rings -->
    <circle cx="50" cy="50" r="36" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.35" />
    <circle cx="50" cy="50" r="26" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.45" />

    <!-- Dies Grid -->
    <rect x="40" y="40" width="9" height="9" rx="1.5" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="51" y="40" width="9" height="9" rx="1.5" fill="#06b6d4" fill-opacity="0.4" stroke="#22d3ee" stroke-width="0.8" />
    <rect x="40" y="51" width="9" height="9" rx="1.5" fill="#10b981" fill-opacity="0.4" stroke="#34d399" stroke-width="0.8" />
    <rect x="51" y="51" width="9" height="9" rx="1.5" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Pulse Wave -->
    <path d="M 12 50 L 30 50 L 35 42 L 41 58 L 47 28 L 54 70 L 60 36 L 65 56 L 70 48 L 75 50 L 88 50" 
          stroke="url(#wp-pulse-grad)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#wp-glow)" />
    <circle cx="50" cy="50" r="2.5" fill="#ffffff" filter="url(#wp-glow)" />
  </g>

  <!-- Typography: WaferPulse -->
  <text x="130" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#f8fafc">
    Wafer<tspan fill="#38bdf8">Pulse</tspan>
  </text>
  <!-- Subtitle Tagline -->
  <text x="132" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#64748b">
    INDUSTRIAL SEMICONDUCTOR MLOPS
  </text>
</svg>
