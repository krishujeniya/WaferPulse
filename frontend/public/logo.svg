<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="wafer-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pulse-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="disc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#disc-glow)" />

  <!-- Outer Silicon Wafer Edge with Orientation Notch at 6 o'clock -->
  <path d="M 60 6 
           A 54 54 0 0 1 114 60 
           A 54 54 0 0 1 65 113.8 
           L 60 110 
           L 55 113.8 
           A 54 54 0 0 1 6 60 
           A 54 54 0 0 1 60 6 Z" 
        stroke="url(#wafer-gradient)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        fill="#080c14" />

  <!-- Concentric Telemetry Rings -->
  <circle cx="60" cy="60" r="44" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.4" />
  <circle cx="60" cy="60" r="32" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.5" />
  <circle cx="60" cy="60" r="18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Micro-Die Grid Lines -->
  <path d="M 32 24 L 32 96 M 46 16 L 46 104 M 60 10 L 60 110 M 74 16 L 74 104 M 88 24 L 88 96" 
        stroke="#38bdf8" 
        stroke-width="0.75" 
        stroke-opacity="0.2" />
  <path d="M 24 32 L 96 32 M 16 46 L 104 46 M 10 60 L 110 60 M 16 74 L 104 74 M 24 88 L 96 88" 
        stroke="#38bdf8" 
        stroke-width="0.75" 
        stroke-opacity="0.2" />

  <!-- Selected Active Silicon Dies -->
  <rect x="47.5" y="47.5" width="11" height="11" rx="1.5" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1" />
  <rect x="61.5" y="47.5" width="11" height="11" rx="1.5" fill="#06b6d4" fill-opacity="0.4" stroke="#22d3ee" stroke-width="1" />
  <rect x="47.5" y="61.5" width="11" height="11" rx="1.5" fill="#10b981" fill-opacity="0.4" stroke="#34d399" stroke-width="1" />
  <rect x="61.5" y="61.5" width="11" height="11" rx="1.5" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1" />

  <!-- High-Frequency Telemetry Pulse Waveform (Kiki Precision Signal) -->
  <path d="M 16 60 
           L 36 60 
           L 42 50 
           L 48 72 
           L 54 36 
           L 62 84 
           L 70 42 
           L 76 66 
           L 82 56 
           L 88 60 
           L 104 60" 
        stroke="url(#pulse-gradient)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow-blur)" />

  <!-- Center Telemetry Node Core -->
  <circle cx="60" cy="60" r="3" fill="#ffffff" filter="url(#glow-blur)" />
  <circle cx="60" cy="60" r="1.5" fill="#06b6d4" />
</svg>
