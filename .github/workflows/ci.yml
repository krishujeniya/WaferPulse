name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/uv venv .venv
          source .venv/bin/activate
          $HOME/.local/bin/uv pip install -r requirements.txt ruff pytest httpx

      - name: Verify Ruff Code Quality
        run: |
          source .venv/bin/activate
          ruff check --select E,F --ignore E501 src backend

      - name: Execute Full MLOps Test Ratchet
        run: |
          source .venv/bin/activate
          PYTHONPATH=. pytest tests/ -v

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        working-directory: frontend
        run: bun install

      - name: Build Frontend Bundle
        working-directory: frontend
        env:
          NODE_ENV: production
        run: bun run build
