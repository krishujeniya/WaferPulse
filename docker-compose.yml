version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./reports:/app/reports
      - ./Training_Batch_Files:/app/Training_Batch_Files
      - ./Prediction_Batch_files:/app/Prediction_Batch_files
    environment:
      - DATABASE_URL=sqlite:////app/waferpulse.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
