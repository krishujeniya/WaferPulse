services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: waferpulse_backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - waferpulse_artifacts:/app/artifacts
      - waferpulse_data:/app/data
      - waferpulse_reports:/app/reports
    environment:
      - DATABASE_URL=sqlite:////app/waferpulse.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - waferpulse-net

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: waferpulse_frontend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - waferpulse-net

volumes:
  waferpulse_artifacts:
  waferpulse_data:
  waferpulse_reports:

networks:
  waferpulse-net:
    driver: bridge
